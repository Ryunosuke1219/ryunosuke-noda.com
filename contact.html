<main>

  <div class="page-head">
    <p class="sec-label">Contact</p>
    <h1 style="line-height:1.9">AIで医療と医師はどう変わるのか。<br>この問いに共に挑む。</h1>
  </div>

  <section class="section tight" style="padding-top:30px">
    <div class="cform">
      <p style="color:var(--dim)">講演・執筆・取材・共同研究などのご依頼をお受けしています。<br>こちらのフォームよりお問い合わせください。</p>
      <p class="notice">※診療に関する個別のご相談にはお応えできません。おかかりの医療機関にご相談ください。</p>

      <form action="https://formsubmit.co/704de5298e5ec9934801c51a5c9f1bdf" method="POST">
        <input type="hidden" name="_subject" value="【個人サイト】お問い合わせ">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">

        <label for="cf-name">お名前<span class="req">*</span></label>
        <input id="cf-name" type="text" name="お名前" required autocomplete="name">

        <label for="cf-org">ご所属<span class="req">*</span></label>
        <input id="cf-org" type="text" name="ご所属" required autocomplete="organization">

        <label for="cf-email">メールアドレス<span class="req">*</span></label>
        <input id="cf-email" type="email" name="email" required autocomplete="email">

        <label for="cf-type">ご用件の種別<span class="req">*</span></label>
        <select id="cf-type" name="ご用件の種別" required>
          <option value="">選択してください</option>
          <option>講演・研修のご依頼</option>
          <option>執筆のご依頼</option>
          <option>取材・出演のご依頼</option>
          <option>共同研究・委員就任のご相談</option>
          <option>その他のお仕事のご依頼</option>
        </select>

        <label for="cf-body">内容<span class="req">*</span></label>
        <textarea id="cf-body" name="内容" required placeholder="ご依頼の概要・想定時期などをご記入ください"></textarea>

        <button class="btn btn-primary" type="submit">送信する</button>
      </form>
    </div>
  </section>

</main>
